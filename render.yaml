# Render-Blueprint für die einfache Variante: Static Site, Zugang nur mit Schlüssel.
# (Konten mit Server + Datenbank: render.accounts.yaml / DEPLOY.md)
services:
  - type: web
    runtime: static
    name: schematic-viewer
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: ACCESS_KEY
        sync: false          # Wert im Dashboard eintragen – NICHT hier und NICHT im Repository
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
